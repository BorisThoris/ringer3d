[package]
name = "ringer3d"
version = "0.1.0"
description = "Ringer 3D — the classic playground marble game, rebuilt in 3D"
authors = ["BorisThoris"]
edition = "2021"

[lib]
name = "ringer3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
